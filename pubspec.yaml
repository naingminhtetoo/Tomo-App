name: tomo
description: Tomo v2 Japanese Study Companion
publish_to: none
version: 2.0.0+1

environment:
  sdk: '>=3.10.0 <4.0.0'
  flutter: '>=3.38.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^3.0.3
  go_router: ^17.0.0
  crypto: ^3.0.6
  drift: ^2.30.0
  sqlite3: ^2.9.4
  sqlite3_flutter_libs: ^0.5.41
  path: ^1.9.1
  http: ^1.6.0
  path_provider: ^2.1.5
  shared_preferences: ^2.5.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/data/content-manifest.json
    - assets/data/n2.json
